spring:
  jpa:
    show-sql: false

  flyway:
    # In production, only apply schema migrations — skip seed data
    locations: classpath:db/migration
    out-of-order: false

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.example.employeemanagement: INFO
