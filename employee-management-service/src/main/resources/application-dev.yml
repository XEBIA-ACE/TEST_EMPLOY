# ── Development profile overrides ───────────────────────────────────────────
# Activate with: SPRING_PROFILES_ACTIVE=dev

spring:
  jpa:
    show-sql: true

logging:
  level:
    com.company.employee: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

springdoc:
  swagger-ui:
    try-it-out-enabled: true
