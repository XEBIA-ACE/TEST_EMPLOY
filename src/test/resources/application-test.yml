# ── Test profile ────────────────────────────────────────────────────────────
# Uses H2 in-memory database so tests run without a real PostgreSQL instance.
# Flyway migrations are also applied to H2 to verify schema correctness.

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none    # Still managed by Flyway

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    user:
      name: testuser
      password: testpass

logging:
  level:
    com.example.employee: DEBUG
    org.hibernate.SQL: DEBUG
