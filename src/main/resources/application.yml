spring:
  application:
    name: employee-management-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ── JPA ────────────────────────────────────────────────────────────────────
  jpa:
    open-in-view: false          # Prevent lazy-loading pitfalls in controllers
    show-sql: false
    hibernate:
      ddl-auto: validate         # Schema managed by Flyway; Hibernate only validates
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50         # Enable JDBC batching for bulk inserts/updates
        order_inserts: true
        order_updates: true

  # ── Flyway ─────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Jackson ────────────────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false
    date-format: "yyyy-MM-dd'T'HH:mm:ss"

# ── Server ─────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024
  error:
    include-message: always
    include-binding-errors: always

# ── Actuator ───────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true         # Kubernetes liveness/readiness probes
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# ── Application info surfaced via /actuator/info ──────────────────────────
info:
  app:
    name: ${spring.application.name}
    description: Employee Management REST API
    version: "@project.version@"

# ── Logging ────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.example.employee: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/application.log}

# ── OpenAPI ────────────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  default-produces-media-type: application/json
